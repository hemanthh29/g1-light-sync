name: Build iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build unsigned iPhone app
        run: |
          xcodebuild \
            -project MitsukoG1.xcodeproj \
            -scheme MitsukoG1 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/mitsuko-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA for local signing
        run: |
          app="$RUNNER_TEMP/mitsuko-build/Build/Products/Release-iphoneos/MitsukoG1.app"
          test -d "$app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/MitsukoG1-unsigned.ipa"

      - name: Save IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MitsukoG1-unsigned-IPA
          path: MitsukoG1-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
