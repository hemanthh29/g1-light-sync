name: Build G1 Light Sync iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build for iPhone
        run: |
          xcodebuild \
            -project ios/MitsukoG1.xcodeproj \
            -target MitsukoG1 \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/MitsukoG1Products" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          mkdir -p "$RUNNER_TEMP/G1LightSyncIPA/Payload" dist
          cp -R "$RUNNER_TEMP/MitsukoG1Products/MitsukoG1.app" \
            "$RUNNER_TEMP/G1LightSyncIPA/Payload/"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/G1LightSyncIPA/Payload" dist/G1LightSync-unsigned.ipa
          (cd dist && shasum -a 256 G1LightSync-unsigned.ipa > SHA256SUMS.txt)

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: G1LightSync-unsigned-IPA
          path: |
            dist/G1LightSync-unsigned.ipa
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
