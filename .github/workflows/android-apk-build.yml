name: Build G1 Light Sync Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: android/**/*.gradle*

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare release artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/G1LightSync-android.apk
          (cd dist && sha256sum G1LightSync-android.apk > SHA256SUMS.txt)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: G1LightSync-android-APK
          path: |
            dist/G1LightSync-android.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
